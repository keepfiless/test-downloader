name: ⬇️ 1-Download from url

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated list of URLs to download'
        required: true
        type: string
      mode:
        description: 'Download mode'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - zip
      split_threshold_mb:
        description: 'Split files larger than this MB (0 = never split)'
        required: false
        default: 90
        type: number

jobs:
  save-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install aria2 and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 zip

      - name: AVASAM Downloader - https://avasam.ir
        run: |
          echo "🏷️  AVASAM - Your Download Solution"
          echo "🌐 https://avasam.ir"
          echo ""

      - name: Download files
        run: |
          MODE="${{ github.event.inputs.mode }}"
          URLS="${{ github.event.inputs.urls }}"
          SPLIT_THRESHOLD_MB="${{ github.event.inputs.split_threshold_mb }}"
          SPLIT_THRESHOLD_BYTES=$(( SPLIT_THRESHOLD_MB * 1024 * 1024 ))

          echo "🏷️  AVASAM (https://avasam.ir) - Downloading with mode: $MODE"
          echo "Split threshold: $SPLIT_THRESHOLD_MB MB"

          mkdir -p downloads tmp_downloads

          # Authenticate gh with the GITHUB_TOKEN
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

          # Download each URL
          for URL in $URLS; do
            FILENAME=$(basename "$URL")
            echo "⬇️ Processing $URL -> $FILENAME"

            # Try to handle as GitHub release asset
            if [[ $URL =~ github\.com/([^/]+)/([^/]+)/releases/download/([^/]+)/(.+)$ ]]; then
              OWNER="${BASH_REMATCH[1]}"
              REPO="${BASH_REMATCH[2]}"
              TAG="${BASH_REMATCH[3]}"
              ASSET_NAME="${BASH_REMATCH[4]}"

              echo "🔍 Detected GitHub release asset: $OWNER/$REPO @ $TAG -> $ASSET_NAME"

              # Get asset ID using gh API
              ASSET_ID=$(gh api repos/$OWNER/$REPO/releases/tags/$TAG \
                --jq ".assets[] | select(.name==\"$ASSET_NAME\") | .id")

              if [ -n "$ASSET_ID" ]; then
                echo "✅ Found asset ID: $ASSET_ID, fetching fresh download URL..."
                # Get fresh download URL (follows redirect)
                DOWNLOAD_URL=$(gh api repos/$OWNER/$REPO/releases/assets/$ASSET_ID \
                  --header "Accept: application/octet-stream" \
                  --jq ".url" 2>/dev/null || echo "")
                
                if [ -n "$DOWNLOAD_URL" ]; then
                  echo "🔄 Downloading with fresh URL..."
                  wget --header="Accept: application/octet-stream" \
                       --user-agent="Mozilla/5.0" \
                       -O "tmp_downloads/$FILENAME" \
                       "$DOWNLOAD_URL"
                else
                  echo "⚠️ Could not get fresh URL, falling back to original with user-agent"
                  wget --user-agent="Mozilla/5.0" -O "tmp_downloads/$FILENAME" "$URL"
                fi
              else
                echo "⚠️ Asset not found via API, using original URL with user-agent"
                wget --user-agent="Mozilla/5.0" -O "tmp_downloads/$FILENAME" "$URL"
              fi
            else
              echo "⚠️ Not a GitHub release URL, downloading directly with user-agent"
              wget --user-agent="Mozilla/5.0" -O "tmp_downloads/$FILENAME" "$URL"
            fi

            # Check if download succeeded
            if [ $? -ne 0 ] || [ ! -s "tmp_downloads/$FILENAME" ]; then
              echo "❌ Download failed for $FILENAME"
              exit 1
            fi
            echo "✅ Downloaded: $FILENAME"
          done

          # Zip all downloads if mode is 'zip'
          if [ "$MODE" = "zip" ]; then
            ARCHIVE_NAME="downloads/archive_$(date +%Y%m%d_%H%M%S).zip"
            echo "📦 Creating zip archive: $ARCHIVE_NAME"
            zip -j "$ARCHIVE_NAME" tmp_downloads/*
            rm -rf tmp_downloads
          else
            # Normal mode: handle splitting large files
            for FILE in tmp_downloads/*; do
              [ -f "$FILE" ] || continue
              SIZE=$(stat -c%s "$FILE")
              BASENAME=$(basename "$FILE")

              if [ "$SPLIT_THRESHOLD_BYTES" -gt 0 ] && [ "$SIZE" -gt "$SPLIT_THRESHOLD_BYTES" ]; then
                echo "✂️ $BASENAME is $(( SIZE / 1024 / 1024 ))MB — splitting into ${SPLIT_THRESHOLD_MB}MB parts (zip-split)"
                # Create a zip split into parts that can be reassembled with `zip -F`
                zip -0 -s "${SPLIT_THRESHOLD_MB}m" "downloads/${BASENAME}.zip" -j "$FILE"
                echo "✅ Parts: $(ls downloads/${BASENAME}.z* 2>/dev/null | wc -l)"
              else
                cp "$FILE" "downloads/$BASENAME"
              fi
            done
            rm -rf tmp_downloads
          fi

      - name: Commit & Push in batches of 5 files (AVASAM)
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          echo "🏷️  AVASAM (https://avasam.ir) - Preparing to commit files"

          # Collect all new/modified files under downloads/
          mapfile -t ALL_FILES < <(git ls-files --others --modified --exclude-standard downloads/)

          TOTAL=${#ALL_FILES[@]}
          echo "📦 Total files to push: $TOTAL"

          if [ "$TOTAL" -eq 0 ]; then
            echo "Nothing to commit"
            exit 0
          fi

          BATCH_SIZE=5
          BATCH_NUM=0

          for (( i=0; i<TOTAL; i+=BATCH_SIZE )); do
            BATCH_NUM=$(( BATCH_NUM + 1 ))
            BATCH=("${ALL_FILES[@]:i:BATCH_SIZE}")

            echo "🚀 Pushing batch $BATCH_NUM: files $((i+1))–$(( i + ${#BATCH[@]} )) of $TOTAL"

            git add "${BATCH[@]}"
            git commit -m "[AVASAM] Add downloaded files — batch $BATCH_NUM [skip ci]"

            # Pull with rebase before each push to avoid conflicts
            git pull --rebase origin "$BRANCH"
            git push origin HEAD:"$BRANCH"

            echo "✅ Batch $BATCH_NUM pushed"
          done

          echo "🎉 All $TOTAL files pushed in $BATCH_NUM batch(es) — AVASAM (https://avasam.ir)"
